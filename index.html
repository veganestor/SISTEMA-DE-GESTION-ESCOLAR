<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sistema de Gestión Escolar — Escuela Secundaria de Los Bulacios</title>
    <meta name="description" content="Sistema integral de gestión escolar institucional: legajos, calificaciones, asistencia diaria, calendario, carnets escolares con QR y respaldo local." />
    <meta property="og:title" content="Sistema de Gestión Escolar Institucional" />
    <meta property="og:description" content="Gestión de alumnos, docentes, asistencias, calificaciones, calendario escolar y carnets con código QR." />
    <meta property="og:type" content="website" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SGE Escolar" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Typography: Plus Jakarta Sans + DM Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --aero-sky: #38bdf8;
        --aero-cyan: #06b6d4;
        --aero-aqua: #14b8a6;
        --aero-emerald: #10b981;
        --aero-deep: #0c2d48;
        --aero-glass-bg: rgba(255, 255, 255, 0.78);
        --aero-glass-strong: rgba(255, 255, 255, 0.90);
        --aero-glass-border: rgba(255, 255, 255, 0.85);
      }

      html, body {
        font-family: 'DM Sans', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #0c2d48;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      h1, h2, h3, h4, .font-display {
        font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, sans-serif;
      }

      .font-mono, .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Frutiger Aero Luminous Atmospheric Canvas */
      .aero-canvas {
        background-color: #dff4ff;
        background-image:
          radial-gradient(ellipse 80% 55% at 15% -10%, rgba(56, 189, 248, 0.42), transparent 62%),
          radial-gradient(ellipse 65% 50% at 90% 8%, rgba(20, 184, 166, 0.28), transparent 60%),
          radial-gradient(ellipse 70% 55% at 75% 95%, rgba(16, 185, 129, 0.20), transparent 60%),
          linear-gradient(180deg, #e0f5ff 0%, #eefbff 46%, #e7f9f4 100%);
        background-attachment: fixed;
      }

      /* Translucent Glassmorphism Surfaces */
      .aero-glass {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.90) 0%, rgba(244, 252, 255, 0.78) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 12px 32px -12px rgba(2, 132, 199, 0.16),
          0 2px 6px rgba(12, 45, 72, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      .aero-glass-soft {
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(186, 230, 253, 0.75);
        box-shadow: 0 6px 20px -8px rgba(2, 132, 199, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* Glossy Frutiger Aero Header Bar */
      .aero-header {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.06) 48%, rgba(0, 0, 0, 0.04) 50%, rgba(255, 255, 255, 0.05) 100%),
          linear-gradient(110deg, #0369a1 0%, #0284c7 42%, #0891b2 76%, #0d9488 100%);
        box-shadow:
          0 10px 30px -10px rgba(3, 105, 161, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }

      /* Glossy Buttons with Specular Highlight Band */
      .aero-btn-primary {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, #38bdf8 0%, #0284c7 52%, #0369a1 100%);
        color: #ffffff;
        border: 1px solid rgba(125, 211, 252, 0.8);
        box-shadow:
          0 8px 18px -6px rgba(2, 132, 199, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      .aero-btn-primary::before,
      .aero-btn-emerald::before,
      .aero-btn-aqua::before {
        content: '';
        position: absolute;
        inset: 1px 2px auto 2px;
        height: 46%;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.05));
        pointer-events: none;
      }
      .aero-btn-primary:hover {
        filter: brightness(1.06);
      }

      .aero-btn-emerald {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, #34d399 0%, #10b981 52%, #059669 100%);
        color: #ffffff;
        border: 1px solid rgba(167, 243, 208, 0.85);
        box-shadow:
          0 8px 18px -6px rgba(5, 150, 105, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .aero-btn-aqua {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, #22d3ee 0%, #0891b2 52%, #0e7490 100%);
        color: #ffffff;
        border: 1px solid rgba(165, 243, 252, 0.85);
        box-shadow:
          0 8px 18px -6px rgba(8, 145, 178, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      /* Safe area bottom padding for mobile PWA */
      .pb-safe {
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      }

      /* Splash screen styling (hidden once React mounts) */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(145deg, #e0f5ff 0%, #bae6fd 50%, #ccfbf1 100%);
        color: #0c2d48;
        transition: opacity 0.25s ease;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Screen base utilities */
      .print-only {
        display: none !important;
      }

      /* ==========================================================================
         DEDICATED PRINT STYLESHEET (Legajos Oficiales + Planchas de Carnets A4)
         ========================================================================== */
      @media print {
        @page {
          size: A4 portrait;
          margin: 10mm 12mm 12mm 12mm;
        }

        /* 1. Global Reset for Paper Presentation */
        html, body {
          background-color: #ffffff !important;
          background: #ffffff !important;
          color: #0f172a !important;
          font-family: 'Plus Jakarta Sans', 'DM Sans', ui-sans-serif, system-ui, -apple-system, Arial, sans-serif !important;
          font-size: 10pt !important;
          line-height: 1.35 !important;
          width: 100% !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* 2. Hide Screen-Only and Interactive Elements */
        .no-print,
        header,
        aside,
        nav,
        button,
        input,
        select,
        textarea,
        .student-screen-view,
        #app-splash {
          display: none !important;
        }

        /* 3. Show Dedicated Print Layout */
        .print-only {
          display: block !important;
        }

        /* 4. Layout Container Normalization */
        #root,
        .min-h-screen,
        main {
          overflow: visible !important;
          height: auto !important;
          min-height: 0 !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          filter: none !important;
          transform: none !important;
          background: transparent !important;
        }

        main,
        main > div {
          max-width: 100% !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          background: transparent !important;
        }

        /* 5. Dedicated Print Sheet Styles (Legajo) */
        .student-print-sheet {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 auto !important;
          padding: 0 !important;
          background: #ffffff !important;
          color: #0f172a !important;
        }

        .student-print-sheet img {
          max-width: 100% !important;
          object-fit: cover !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* 5b. Dedicated Print Sheet Styles (Carnets A4) */
        .carnet-print-sheet {
          display: block !important;
          width: 100% !important;
          background: #ffffff !important;
        }
        .carnet-print-item {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* 6. Page Break Controls */
        .print-avoid-break,
        .print-section,
        .print-table tr,
        .print-signature-box {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        /* 7. High-Contrast Paper Tables */
        .print-table {
          width: 100% !important;
          border-collapse: collapse !important;
          border-spacing: 0 !important;
          margin-top: 4px !important;
          margin-bottom: 6px !important;
        }

        .print-table th,
        .print-table td {
          border: 1px solid #475569 !important;
          padding: 3.5px 6px !important;
          font-size: 8.5pt !important;
          color: #0f172a !important;
        }

        .print-table th {
          background-color: #e2e8f0 !important;
          font-weight: 700 !important;
          text-transform: uppercase !important;
          letter-spacing: 0.04em !important;
          text-align: center !important;
        }

        /* 8. Text Formatting and Contrast */
        .print-badge {
          border: 1px solid #475569 !important;
          padding: 1px 6px !important;
          font-size: 8pt !important;
          font-weight: bold !important;
          border-radius: 3px !important;
          display: inline-block !important;
        }

        .print-border {
          border: 1px solid #94a3b8 !important;
        }

        .print-border-b {
          border-bottom: 1px solid #94a3b8 !important;
        }

        a {
          text-decoration: none !important;
          color: inherit !important;
        }
      }
    </style>
  </head>
  <body class="aero-canvas">
    <div id="app-splash" aria-hidden="true">
      <img src="/icon.svg" alt="" width="72" height="72" style="border-radius: 20px; box-shadow: 0 12px 28px rgba(2,132,199,0.28);" />
      <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -0.01em;">
        Sistema de Gestión Escolar
      </div>
      <div style="font-size: 12px; color: #0369a1; font-weight: 600;">
        Cargando espacio institucional...
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
